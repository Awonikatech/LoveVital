# Local / demo stack: MySQL 8 + FastAPI + React (nginx).
#   cp .env.example .env && docker compose up --build
#   open http://localhost:8080      (API docs: http://localhost:8080/api/docs)
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-swarnika}
      MYSQL_USER: ${MYSQL_USER:-swarnika}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-swarnika_dev_pw}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pw}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_pw}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-swarnika}:${MYSQL_PASSWORD:-swarnika_dev_pw}@mysql:3306/${MYSQL_DATABASE:-swarnika}?charset=utf8mb4
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - media:/app/media/uploads
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  mysql_data:
  media:
